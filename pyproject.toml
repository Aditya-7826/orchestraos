[project]
name = "orchestraos"
version = "0.1.0"
description = "A free, local multi-agent AI operating system (LangGraph + MCP + Ollama)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "psutil>=6.0",
    "langchain-ollama>=1.1.0",
    "langchain-core>=1.7.6",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.30.0",
    "langchain-mcp-adapters>=0.3.2",
    "ddgs>=9.16.1",
    "beautifulsoup4>=4.15.0",
    "aiosqlite>=0.22.1",
    "pypdf>=6.21.4",
]

[project.scripts]
orchestraos = "orchestraos.cli:main"
orchestraos-doctor = "orchestraos.doctor:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs a running Ollama with the configured models (uv run pytest -m live)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
