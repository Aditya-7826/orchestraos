[project]
name = "orchestraos"
version = "0.1.0"
description = "A free, local multi-agent AI operating system (LangGraph + MCP + Ollama)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "psutil>=6.0",
    "langchain-ollama>=1.1.0",
    "langchain-core>=1.7.6",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[project.scripts]
orchestraos = "orchestraos.cli:main"
orchestraos-doctor = "orchestraos.doctor:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: needs a running Ollama with the configured models (uv run pytest -m live)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
