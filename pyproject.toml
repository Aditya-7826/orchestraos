[project]
name = "orchestraos"
version = "0.1.0"
description = "A free, local multi-agent AI operating system (LangGraph + MCP + Ollama)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "psutil>=6.0",
]

[project.scripts]
orchestraos-doctor = "orchestraos.doctor:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
