name: orchestraos

# Profiles keep the stack runnable on an 8 GB laptop:
#   docker compose up -d                       -> core: api + ui
#   docker compose --profile graph up -d       -> + Neo4j
# Ollama runs on the host (not here) so the model's RAM isn't inside the Docker VM.

services:
  api:
    build: .
    image: orchestraos-app:latest
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WORKSPACE_DIR: /app/workspace
      DATA_DIR: /app/data
      # The sandbox containers are started by the *host's* Docker daemon, which needs the
      # workspace's host path for bind mounts. `make setup` writes HOST_WORKSPACE to .env.
      SANDBOX_HOST_WORKSPACE: ${HOST_WORKSPACE:?run `make setup` (sets HOST_WORKSPACE in .env)}
      # If .env enables graph memory (NEO4J_URI), reach Neo4j by its service name in Docker.
      NEO4J_URI: ${NEO4J_URI:+bolt://neo4j:7687}
      # With RESEARCH_MODE=a2a (and `--profile a2a`), research runs in the `research` service.
      A2A_RESEARCH_URL: http://research:8100/
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux; harmless elsewhere
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
      # Lets the python_sandbox MCP server start sandbox containers on the host daemon.
      # Trade-off: this gives the api container control of Docker. Fine for a local,
      # single-user app; for anything shared, run the sandbox behind a separate service.
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    image: orchestraos-app:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      ORCHESTRA_API: http://api:8000
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0",
              "--server.port=8501", "--server.headless=true",
              "--browser.gatherUsageStats=false"]
    ports:
      - "${UI_PORT:-8501}:8501"
    mem_limit: 512m

  # The research agent as a standalone A2A service (Agent Card at /.well-known/agent-card.json).
  research:
    image: orchestraos-app:latest
    profiles: ["a2a"]
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WORKSPACE_DIR: /app/workspace
      A2A_PUBLIC_URL: http://research:8100/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "orchestraos.a2a.research_service:app", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "8100:8100"
    volumes:
      - ./workspace:/app/workspace:ro
    mem_limit: 768m

  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Small heap/page cache: our graph is tiny, the defaults are sized for servers.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "7474:7474"  # browser UI
      - "7687:7687"  # bolt
    volumes:
      - neo4j-data:/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  neo4j-data:
